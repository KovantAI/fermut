name: Action self-test

# Exercises the composite actions (`KovantAI/fermut`, `/sweep`, `/merge`) against
# examples/sample, using a fermut binary built from this commit so a change to
# the CLI and a change to the action are tested together.

on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "sweep/**"
      - "merge/**"
      - "scripts/action/**"
      - ".github/workflows/action.yml"
      - "examples/sample/**"
  pull_request:
    paths:
      - "action.yml"
      - "sweep/**"
      - "merge/**"
      - "scripts/action/**"
      - ".github/workflows/action.yml"
      - "examples/sample/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  SAMPLE: examples/sample
  # examples/sample declares no dependencies; install the test stack directly.
  INSTALL: uv venv --quiet && uv pip install --quiet pytest pytest-cov

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1-rust"
          key: action-selftest
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fermut-bin
          path: target/release/fermut
          retention-days: 1

  full:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &bin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fermut-bin
          path: ${{ runner.temp }}/fermut-bin
      - &path
        name: Put fermut on PATH
        run: |
          chmod +x "$RUNNER_TEMP/fermut-bin/fermut"
          echo "$RUNNER_TEMP/fermut-bin" >> "$GITHUB_PATH"
      - id: fermut
        uses: ./sweep
        with:
          working-directory: ${{ env.SAMPLE }}
          fermut-version: project
          install-command: ${{ env.INSTALL }}
          fail-under: "50"
      - name: Assert outputs
        env:
          SCORED: ${{ steps.fermut.outputs.scored }}
          SCORE: ${{ steps.fermut.outputs.score }}
          JSON: ${{ steps.fermut.outputs.report-json }}
        run: |
          echo "score=$SCORE scored=$SCORED"
          test "$SCORED" -gt 0
          test -n "$SCORE"
          test -s "$JSON"

  shard:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *bin
      - *path
      - uses: ./sweep
        with:
          shard: ${{ matrix.shard }}/2
          working-directory: ${{ env.SAMPLE }}
          fermut-version: project
          install-command: ${{ env.INSTALL }}
          artifact-name: selftest

  merge:
    needs: [build, shard]
    runs-on: ubuntu-latest
    steps:
      # Only to load ./merge from this commit; a real caller needs no checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *bin
      - *path
      - id: fermut
        uses: ./merge
        with:
          fermut-version: project
          artifact-name: selftest
          fail-under: "50"
      - name: Assert merged outputs
        env:
          SCORED: ${{ steps.fermut.outputs.scored }}
        run: test "$SCORED" -gt 0

  pr:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *bin
      - *path
      # Most PRs here don't touch examples/sample, so this usually exercises
      # the N/A short-circuit; blocking: false keeps a sample survivor from
      # failing an unrelated PR.
      - id: fermut
        uses: ./
        with:
          working-directory: ${{ env.SAMPLE }}
          fermut-version: project
          install-command: ${{ env.INSTALL }}
          blocking: "false"
          comment: "false"
      - name: Assert outputs
        env:
          SKIPPED: ${{ steps.fermut.outputs.skipped }}
          SCORED: ${{ steps.fermut.outputs.scored }}
        run: |
          echo "skipped=$SKIPPED scored=$SCORED"
          case "$SKIPPED" in true|false) ;; *) exit 1 ;; esac

  warm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *bin
      - *path
      - uses: ./
        with:
          warm-only: "true"
          working-directory: ${{ env.SAMPLE }}
          fermut-version: project
          install-command: ${{ env.INSTALL }}
      - run: test -s "$SAMPLE/.coverage"
