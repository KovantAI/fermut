name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # OS-independent. Run once on ubuntu — don't duplicate on mac/windows.
    name: fmt + clippy (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Stable on all three platforms catches OS-specific regressions.
        # Beta on ubuntu only gives a single-week heads-up before the next
        # stable lands.
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "v1-rust"
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
      # The `ruff` git dependency contains snapshot files whose paths exceed the
      # legacy Windows 260-char MAX_PATH limit, which makes cargo's bundled
      # libgit2 checkout fail (`path too long; class=Filesystem (30)`). Enable
      # git long-path support and fetch git deps via the git CLI, which honors
      # `core.longpaths`, so the checkout succeeds.
      - if: runner.os == 'Windows'
        name: Enable long paths for cargo git checkouts
        shell: bash
        run: |
          git config --global core.longpaths true
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - run: cargo test --all-features --locked

  e2e:
    # End-to-end tests that drive the `fermut` binary against examples/sample,
    # which shells out to `pytest`. These are #[ignore]'d in `cargo test` so the
    # lint/test/msrv jobs need no Python; this job sets up the env and runs them.
    name: e2e (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # `baseline` gates on `fermut doctor`, which requires pytest, coverage,
      # pytest-cov (per-test contexts) and ty (mutant pre-filter) to all pass.
      # `rstest` is a pytest-compatible drop-in runner; the `--runner rstest`
      # e2e test spawns it from PATH, so it must be installed alongside pytest.
      - run: pip install pytest coverage pytest-cov ty rstest
      - run: cargo test --all-features --locked --test e2e -- --include-ignored

  coverage:
    # Rust line coverage via cargo-llvm-cov. Runs the full suite including the
    # #[ignore]'d e2e tests (which spawn the `fermut` binary) so subprocess
    # coverage is captured too — hence the Python/pytest setup mirrors the e2e
    # job. Emits lcov and uploads to Codecov.
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest coverage pytest-cov ty rstest
      - run: cargo llvm-cov --all-features --locked --lcov --output-path lcov.info -- --include-ignored
      - uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    # Build-check against the declared MSRV in Cargo.toml. Tests + clippy run
    # on stable; this job only catches accidental use of post-MSRV features.
    name: cargo check (MSRV 1.83)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.83"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - run: cargo check --all-targets --all-features --locked
