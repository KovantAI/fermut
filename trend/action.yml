# Record a sharded fermut sweep as one trend point and gate on regressions.
#
#   jobs:
#     warm:                       # build the coverage DB once
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@<sha>
#         - uses: KovantAI/fermut@v0.5.0
#           with:
#             warm-only: "true"
#     shard:
#       needs: warm               # every shard restores warm's coverage DB
#       runs-on: ubuntu-latest
#       strategy:
#         matrix:
#           shard: [1, 2, 3, 4]
#       steps:
#         - uses: actions/checkout@<sha>
#         - uses: KovantAI/fermut/sweep@v0.5.0
#           with:
#             shard: ${{ matrix.shard }}/4
#     trend:
#       needs: shard
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@<sha>
#         - uses: KovantAI/fermut/trend@v0.5.0
#           with:
#             fail-on-regression: "1"
#
# Takes the place of KovantAI/fermut/merge in a trend workflow. It merges the
# `<artifact-name>-shard-*` reports, turns the merged report into one history
# entry, appends it to `.fermut/history.jsonl`, writes the trend to the job
# summary, and gates on a score drop vs the previous run on the same branch.
#
# History persists in the Actions cache. Only the default branch saves it, so
# a run on another branch is compared against the default branch's history
# but never forks it. The cache evicts entries unused for 7 days: schedule at
# least weekly, or set `history-cache: "false"` and persist `history-path`
# yourself (commit it, or keep it on a branch). Every run also uploads the
# history in the `<artifact-name>-trend` artifact.
#
# Refuses to record a point with no scored mutants (a vacuous 100%), with more
# than `max-errored` errored mutants, or onto a history file with malformed
# lines.
#
# Needs a checkout: the entry's git sha and branch are read from it.

name: "fermut trend"
description: "Merge fermut shard reports, record the score in a persisted history, and gate on regressions."
author: "KovantAI"

inputs:
  working-directory:
    description: "Project root, relative to the workspace. The history path and the entry's git info resolve from here."
    required: false
    default: "."
  artifact-name:
    description: "The artifact-name the sweep shards used."
    required: false
    default: "fermut-report"
  fail-on-regression:
    description: "Fail when the score dropped more than this many points vs the previous run on the same branch. Empty disables the regression gate."
    required: false
    default: ""
  fail-under:
    description: "Absolute score floor in percent. Empty disables it; unlike merge, survivors alone never fail a trend run."
    required: false
    default: ""
  max-errored:
    description: "Refuse to record the run when more mutants than this errored. Empty allows any number."
    required: false
    default: ""
  blocking:
    description: '"false" turns a failing gate or a refused record into a warning. Setup failures still fail.'
    required: false
    default: "true"
  history-path:
    description: "History file, relative to working-directory."
    required: false
    default: ".fermut/history.jsonl"
  history-cache:
    description: '"true" restores the history from the Actions cache and saves it back on the default branch. "false" leaves persisting history-path to you.'
    required: false
    default: "true"
  default-branch:
    description: "The branch whose runs save the history. Only it writes the cache."
    required: false
    default: ${{ github.event.repository.default_branch }}
  cache-key-prefix:
    description: "History cache namespace. Change it to start a new trend."
    required: false
    default: "fermut"
  config-hash:
    description: >-
      config_hash to stamp into the entry, so `fermut trend` can flag runs whose
      configuration changed. Shards cannot supply one (each hashes its own
      slice), so pass any stable string that changes with the sweep's shape,
      e.g. a hash of your sweep inputs. Empty leaves it unset.
    required: false
    default: ""
  limit:
    description: "Trend entries to show in the job summary."
    required: false
    default: "20"
  fermut-version:
    description: >-
      fermut release to install from PyPI. Empty matches the action ref, else
      the latest release. "project" uses a fermut already on PATH.
    required: false
    default: ""

outputs:
  score:
    description: 'Combined mutation score in percent, or "" when nothing was scored (N/A).'
    value: ${{ steps.stats.outputs.score }}
  scored:
    description: "Mutants with a real verdict."
    value: ${{ steps.stats.outputs.scored }}
  killed:
    description: "Killed mutants."
    value: ${{ steps.stats.outputs.killed }}
  survived:
    description: "Surviving mutants."
    value: ${{ steps.stats.outputs.survived }}
  errored:
    description: "Mutants that errored. Excluded from the score."
    value: ${{ steps.stats.outputs.errored }}
  delta:
    description: 'Score change in points vs the previous run on the same branch, or "" when there is none.'
    value: ${{ steps.record.outputs.delta }}
  recorded:
    description: '"true" when the run was appended to the history.'
    value: ${{ steps.record.outputs.recorded }}
  report-json:
    description: "Path to the merged JSON report, relative to the workspace."
    value: ${{ steps.setup.outputs.out }}/report.json
  history:
    description: "Path to the history file, relative to the workspace."
    value: ${{ inputs.working-directory }}/${{ inputs.history-path }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: setup
      shell: bash
      env:
        BOOL_blocking: ${{ inputs.blocking }}
        BOOL_history_cache: ${{ inputs.history-cache }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        REGRESSION: ${{ inputs.fail-on-regression }}
        MAX_ERRORED: ${{ inputs.max-errored }}
        WD: ${{ inputs.working-directory }}
        ARTIFACT: ${{ inputs.artifact-name }}
        BRANCH: ${{ inputs.default-branch }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/action/setup.sh"

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        enable-cache: false

    - name: Install fermut
      id: fermut
      shell: bash
      env:
        VERSION: ${{ inputs.fermut-version }}
        ACTION_REF: ${{ github.action_ref }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/action/install-fermut.sh"

    - name: Resolve fermut
      id: env
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SPEC: ${{ steps.fermut.outputs.spec }}
        NEED_COV: "false"
      run: bash "$GITHUB_ACTION_PATH/../scripts/action/resolve-env.sh"

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: ${{ inputs.artifact-name }}-shard-*
        path: ${{ steps.setup.outputs.out }}/shards

    - name: Merge shard reports
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FERMUT: ${{ steps.env.outputs.bin }}
        OUT: ${{ steps.setup.outputs.out_abs }}
        ARTIFACT: ${{ inputs.artifact-name }}
        ENTRY: ${{ steps.setup.outputs.out_abs }}/entry.json
        PROJECT: .
        CONFIG_HASH: ${{ inputs.config-hash }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/action/merge.sh"

    - name: Read results
      id: stats
      shell: bash
      env:
        OUT: ${{ steps.setup.outputs.out_abs }}
        HEADING: "fermut merged report"
      run: bash "$GITHUB_ACTION_PATH/../scripts/action/stats.sh"

    # One immutable cache entry per run; restore-keys picks the newest.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: inputs.history-cache == 'true'
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.history-path }}
        key: ${{ inputs.cache-key-prefix }}-history-${{ inputs.default-branch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-history-${{ inputs.default-branch }}-

    - name: Record trend point
      id: record
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FERMUT: ${{ steps.env.outputs.bin }}
        ENTRY: ${{ steps.setup.outputs.out_abs }}/entry.json
        HISTORY: ${{ github.workspace }}/${{ inputs.working-directory }}/${{ inputs.history-path }}
        SCORED: ${{ steps.stats.outputs.scored }}
        ERRORED: ${{ steps.stats.outputs.errored }}
        MAX_ERRORED: ${{ inputs.max-errored }}
        LIMIT: ${{ inputs.limit }}
        BLOCKING: ${{ inputs.blocking }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/action/trend-record.sh"

    # Saved before the gate, so a regression is still recorded.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      if: >-
        inputs.history-cache == 'true'
        && steps.record.outputs.recorded == 'true'
        && github.ref == format('refs/heads/{0}', inputs.default-branch)
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.history-path }}
        key: ${{ inputs.cache-key-prefix }}-history-${{ inputs.default-branch }}-${{ github.run_id }}-${{ github.run_attempt }}

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}-trend
        path: |
          ${{ steps.setup.outputs.out }}/report.json
          ${{ steps.setup.outputs.out }}/report.md
          ${{ inputs.working-directory }}/${{ inputs.history-path }}
        if-no-files-found: error
        include-hidden-files: true

    - name: Enforce gate
      if: steps.record.outputs.recorded == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FERMUT: ${{ steps.env.outputs.bin }}
        HISTORY: ${{ github.workspace }}/${{ inputs.working-directory }}/${{ inputs.history-path }}
        BLOCKING: ${{ inputs.blocking }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        SCORE: ${{ steps.stats.outputs.score }}
        REGRESSION: ${{ inputs.fail-on-regression }}
        DELTA: ${{ steps.record.outputs.delta }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/action/trend-gate.sh"
