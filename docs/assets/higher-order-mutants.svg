<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Higher-order mutants. Two killed first-order mutants f1 and f2 have kill-sets K(f1) = t1, t2, t3 and K(f2) = t2, t3, t4, overlapping in t2 and t3. fermut applies both edits at once to make the second-order mutant h and runs the tests. If h is killed only by tests in the overlap, it is a strongly subsuming higher-order mutant (SSHOM): harder to kill than either parent. If no test kills h, the edits mask each other and it is decoupled. If a test outside the overlap kills it, it is non-subsuming." viewBox="0 0 820 520">
<style>
svg { --ink: #1f2427; --muted: #6b7178; --line: #a0a5ab; --box: #f4f5f6; --chip: #ffffff; --accent: #ff523b; --accent-bg: #fff1ef; }
@media (prefers-color-scheme: dark) {
  svg { --ink: #e2e4e9; --muted: #9aa0a6; --line: #5c6370; --box: #2a2d36; --chip: #1e2129; --accent: #ff6a55; --accent-bg: #3a2420; }
}
text { fill: var(--ink); text-anchor: middle; font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.fm-title { font-size: 19px; font-weight: 700; }
.fm-sub { font-size: 14.5px; }
.fm-sm.fm-title { font-size: 17px; }
.fm-sm.fm-sub { font-size: 14px; }
.fm-label { fill: var(--muted); font-size: 12.5px; font-weight: 600; text-anchor: start; }
.fm-tag { fill: var(--accent); font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px; }
.fm-box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
.fm-hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
.fm-loop { fill: var(--box); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 5; }
.fm-chips rect { fill: var(--chip); stroke: var(--accent); }
.fm-chips text { font-size: 12px; font-weight: 600; }
.fm-lane { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
.fm-lane.fm-hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
.fm-row { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.fm-row-text { font-size: 13.5px; }
.fm-note { fill: var(--muted); font-size: 12.5px; }
.fm-line, .fm-edge { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.fm-edge { marker-end: url(#fm-arrow); }
.fm-edge.fm-accent { stroke: var(--accent); marker-end: url(#fm-arrow-accent); }
.fm-head { fill: var(--ink); }
.fm-head-accent { fill: var(--accent); }
.fm-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 15px; }
.fm-code-accent { fill: var(--accent); font-weight: 700; }
.fm-left { text-anchor: start; }
.fm-on { fill: var(--accent); }
.fm-off { fill: none; stroke: var(--line); stroke-width: 1.5; }
.fm-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.fm-venn-a { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2; fill-opacity: 0.6; }
.fm-venn-b { fill: var(--box); stroke: var(--ink); stroke-width: 2; fill-opacity: 0.6; }
.fm-row { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.fm-note { fill: var(--muted); font-size: 12.5px; }
</style>

<defs>
<marker id="fm-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path class="fm-head" d="M0 0L7 3.5L0 7"/></marker>
<marker id="fm-arrow-accent" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path class="fm-head-accent" d="M0 0L7 3.5L0 7"/></marker>
</defs>

<rect class="fm-box" x="20" y="20" width="370" height="260" rx="14"/>
<text class="fm-title fm-sm" x="205" y="50">Two killed first-order mutants</text>
<circle class="fm-venn-a" cx="160" cy="170" r="82"/>
<circle class="fm-venn-b" cx="250" cy="170" r="82"/>
<text class="fm-title fm-sm" x="110" y="78">K(f1)</text>
<text class="fm-title fm-sm" x="300" y="78">K(f2)</text>
<text class="fm-code" x="118" y="176">t1</text>
<text class="fm-code" x="205" y="160">t2</text>
<text class="fm-code" x="205" y="188">t3</text>
<text class="fm-code" x="292" y="176">t4</text>
<text class="fm-note" x="205" y="266">shared killers: t2, t3 (needed to pair them)</text>
<line class="fm-edge" x1="390" y1="145" x2="426" y2="145"/>
<rect class="fm-box fm-hot" x="434" y="20" width="366" height="260" rx="14"/>
<text class="fm-title fm-sm" x="617" y="50">Second-order mutant h</text>
<text class="fm-sub" x="617" y="74">both edits applied together</text>
<rect class="fm-row" x="458" y="96" width="318" height="40" rx="8"/>
<text class="fm-code" x="617" y="122">f1: if lo <tspan class="fm-code-accent">&lt;</tspan> x  (was &lt;=)</text>
<rect class="fm-row" x="458" y="146" width="318" height="40" rx="8"/>
<text class="fm-code" x="617" y="172">f2: and x <tspan class="fm-code-accent">&lt;=</tspan> hi  (was &lt;)</text>
<text class="fm-sub" x="617" y="216">run shared killers first, then the rest</text>
<text class="fm-note" x="617" y="240">same file, same function, non-overlapping edits</text>
<path class="fm-line" d="M617 280 V294 M135 294 H685"/>
<line class="fm-edge fm-accent" x1="135" y1="294" x2="135" y2="306"/>
<line class="fm-edge" x1="410" y1="294" x2="410" y2="306"/>
<line class="fm-edge" x1="685" y1="294" x2="685" y2="306"/>
<rect class="fm-box fm-hot" x="20" y="314" width="230" height="130" rx="14"/>
<text class="fm-title fm-sm" x="135" y="344">SSHOM</text>
<text class="fm-code" x="135" y="374">K(h) = {t3}</text>
<text class="fm-sub fm-sm" x="135" y="402">killed, only by shared killers</text>
<text class="fm-note" x="135" y="424">stands in for f1 and f2</text>
<rect class="fm-box" x="295" y="314" width="230" height="130" rx="14"/>
<text class="fm-title fm-sm" x="410" y="344">Decoupled</text>
<text class="fm-code" x="410" y="374">K(h) = ∅</text>
<text class="fm-sub fm-sm" x="410" y="402">no test kills it</text>
<text class="fm-note" x="410" y="424">the two edits mask each other</text>
<rect class="fm-box" x="570" y="314" width="230" height="130" rx="14"/>
<text class="fm-title fm-sm" x="685" y="344">Non-subsuming</text>
<text class="fm-code" x="685" y="374">K(h) ∋ t1</text>
<text class="fm-sub fm-sm" x="685" y="402">a test outside the overlap</text>
<text class="fm-note" x="685" y="424">keep f1 and f2 instead</text>
<rect class="fm-box fm-loop" x="20" y="462" width="780" height="44" rx="14"/>
<text class="fm-sub" x="410" y="490">SSHOM: K(h) ≠ ∅ and K(h) ⊆ K(f1) ∩ K(f2)</text>

</svg>
