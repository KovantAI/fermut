version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - ci
      - dependencies

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      # All astral-sh/ruff git crates share one release tag in Cargo.toml.
      # Group them so dependabot bumps them together in one PR instead of
      # opening a separate PR per crate (which leaves the tag inconsistent).
      astral-ruff:
        patterns:
          - "ruff_*"
          - "ty_*"
      rust-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - rust
      - dependencies
