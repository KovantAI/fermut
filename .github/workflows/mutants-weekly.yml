name: Mutants (weekly)

# The whole crate, sharded, on a schedule. The trend line here is the real
# signal; the per-PR score swings with the shape of the diff.
#
# ~2200 mutants at a measured 15s median is ~9.4 CPU-hours: past GitHub's 6h
# job limit as one job, inside it as 8. ~11 billed job-hours per run, hence the
# change check below.

on:
  schedule:
    # Sunday 03:00 UTC. Off the weekday CI peak and off dependabot's Monday.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-weekly
  # A run takes over an hour; let an in-flight one finish rather than
  # cancelling it for a manual dispatch.
  cancel-in-progress: false

jobs:
  # Skip the ~11 job-hours when nothing that could move the score has changed
  # since the last successful run. A manual dispatch always runs.
  changed:
    name: anything to test?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the previous run's head SHA.
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The comparison reaches back to an arbitrary earlier commit.
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit
        run: |
          decide() { # decide RUN REASON
            echo "run=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            echo "### cargo-mutants — whole crate" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$FORCED" = "true" ]; then
            decide true "Manual dispatch — running the full crate."
            exit 0
          fi

          last=$(gh run list --workflow mutants-weekly.yml --branch "$BRANCH" \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$last" ]; then
            decide true "No previous successful run to compare against — running."
            exit 0
          fi
          # A force-push can strand the recorded SHA. "Don't know" resolves to
          # running, never to a silent skip.
          if ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            decide true "Last run's commit \`$last\` is no longer reachable — running."
            exit 0
          fi

          # Not code-only: the config decides which mutants exist, the floor
          # decides whether the number passes, the scripts compute it.
          paths=(
            src
            Cargo.toml
            Cargo.lock
            .cargo/mutants.toml
            .github/mutants-floor.txt
            .github/scripts
            .github/workflows/mutants-weekly.yml
          )
          if git diff --quiet "$last" HEAD -- "${paths[@]}"; then
            decide false "No change to src, dependencies, mutants config, or the floor since [\`${last:0:7}\`]($COMMIT_URL/$last) — skipping. Dispatch this workflow manually to force a run."
          else
            changed=$(git diff --name-only "$last" HEAD -- "${paths[@]}" | wc -l | tr -d ' ')
            decide true "$changed relevant file(s) changed since \`${last:0:7}\` — running the full crate."
          fi

  # Shards use --baseline=skip, so none of them checks the unmutated tree.
  # Without this, a broken `main` reports every mutant caught — 100% from a
  # dead suite. Checked once here instead of eight times.
  baseline:
    name: baseline (unmutated tree)
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: mutants
      - run: cargo test --all-features --locked

  shard:
    name: shard ${{ matrix.shard }}/8
    needs: [changed, baseline]
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Must change together with the /8 below: shards disagreeing on `n`
        # split the work differently, and the union has holes and overlaps.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: mutants
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-mutants@27.1.0

      # continue-on-error: a survivor exits non-zero, but those results still
      # need uploading. Only the score job decides what the numbers mean.
      - name: cargo mutants
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo mutants --shard "$SHARD/8" --baseline=skip

      # The score job counts these and refuses to score a partial set.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: error

  score:
    name: score
    needs: [changed, shard]
    if: always() && needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To file the regression issue — a failed scheduled run is easy to miss.
      issues: write
    env:
      SHARDS: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # continue-on-error so the check below reports what is missing, rather
      # than failing here as a bare download error.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: mutants-out-*
          path: shards
          # NOT merge-multiple: every shard writes caught.txt and they would
          # overwrite each other.
          merge-multiple: false

      # A crashed shard drops its slice, and the rest still yield a
      # confident-looking percentage. Refuse to score over a hole.
      - name: Check every shard reported
        run: |
          mkdir -p shards
          n=$(find shards -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "shard results: $n/$SHARDS"
          [ "$n" -eq "$SHARDS" ] || {
            echo "::error::only $n of $SHARDS shards reported — the score would be computed over an incomplete crate"
            exit 1
          }

      - name: Compute the score
        id: score
        run: |
          .github/scripts/mutants-score.sh shards/mutants-out-* | tee -a "$GITHUB_OUTPUT"

      - name: Summarise
        env:
          CAUGHT: ${{ steps.score.outputs.caught }}
          MISSED: ${{ steps.score.outputs.missed }}
          SCORE: ${{ steps.score.outputs.score }}
          FLOOR: ${{ steps.score.outputs.floor }}
        run: |
          {
            echo "### cargo-mutants — whole crate"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| score | **${SCORE}%** |"
            echo "| floor | ${FLOOR}% |"
            echo "| caught | ${CAUGHT} |"
            echo "| missed | ${MISSED} |"
            if [ "$FLOOR" = "0" ]; then
              echo
              echo "Floor is unseeded — commit \`${SCORE}\` (less a few points of headroom) to \`.github/mutants-floor.txt\` to turn the gate on."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare against the floor
        env:
          GH_TOKEN: ${{ github.token }}
          SCORE: ${{ steps.score.outputs.score }}
          SCORED: ${{ steps.score.outputs.scored }}
          FLOOR: ${{ steps.score.outputs.floor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$FLOOR" -eq 0 ]; then
            echo "floor unseeded — nothing to compare against"
            exit 0
          fi
          if [ "$SCORED" -eq 0 ]; then
            echo "::error::no mutant reached a verdict — treating as a failed run, not a passing score"
            exit 1
          fi
          if [ "$SCORE" -ge "$FLOOR" ]; then
            echo "score ${SCORE}% >= floor ${FLOOR}%"
            exit 0
          fi

          echo "::error::mutation score ${SCORE}% is below the floor of ${FLOOR}%"
          title="Mutation score fell to ${SCORE}% (floor ${FLOOR}%)"
          body=$(printf '%s\n' \
            "The weekly whole-crate cargo-mutants run scored **${SCORE}%**, below the floor of **${FLOOR}%** in \`.github/mutants-floor.txt\`." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "The survivors are in the \`mutants-out-*\` artifacts (\`missed.txt\`). Three honest responses, per CONTRIBUTING.md: add the assertion, exclude the mutant as unkillable, or — if the drop is real and accepted — lower the floor deliberately in its own PR.")
          # The label may not exist yet; --force makes this idempotent.
          gh label create mutants --color FBCA04 --description "Mutation testing" --force
          # One issue per regression, commented on rather than duplicated week on week.
          existing=$(gh issue list --state open --label mutants --search "in:title Mutation score fell" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label mutants
          fi
          exit 1
