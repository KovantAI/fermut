name: Action self-test

# Exercises the composite actions (`KovantAI/fermut`, `/sweep`, `/merge`, `/trend`) against
# examples/sample, using a fermut binary built from this commit so a change to
# the CLI and a change to the action are tested together.

on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "sweep/**"
      - "merge/**"
      - "trend/**"
      - "scripts/action/**"
      - ".github/workflows/action.yml"
      - "examples/sample/**"
  pull_request:
    paths:
      - "action.yml"
      - "sweep/**"
      - "merge/**"
      - "trend/**"
      - "scripts/action/**"
      - ".github/workflows/action.yml"
      - "examples/sample/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  SAMPLE: examples/sample
  # examples/sample declares no dependencies; install the test stack directly.
  INSTALL: uv venv --quiet && uv pip install --quiet pytest pytest-cov

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          key: action-selftest
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fermut-bin
          path: target/release/fermut
          retention-days: 1

  full:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &bin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fermut-bin
          path: ${{ runner.temp }}/fermut-bin
      - &path
        name: Put fermut on PATH
        run: |
          chmod +x "$RUNNER_TEMP/fermut-bin/fermut"
          echo "$RUNNER_TEMP/fermut-bin" >> "$GITHUB_PATH"
      - id: fermut
        uses: ./sweep
        with:
          working-directory: ${{ env.SAMPLE }}
          fermut-version: project
          install-command: ${{ env.INSTALL }}
          fail-under: "50"
      - name: Assert outputs
        env:
          SCORED: ${{ steps.fermut.outputs.scored }}
          SCORE: ${{ steps.fermut.outputs.score }}
          JSON: ${{ steps.fermut.outputs.report-json }}
        run: |
          echo "score=$SCORE scored=$SCORED"
          test "$SCORED" -gt 0
          test -n "$SCORE"
          test -s "$JSON"

  shard:
    # After warm, so the shards restore its coverage DB instead of rebuilding.
    needs: [build, warm]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *bin
      - *path
      - uses: ./sweep
        with:
          shard: ${{ matrix.shard }}/2
          working-directory: ${{ env.SAMPLE }}
          fermut-version: project
          install-command: ${{ env.INSTALL }}
          artifact-name: selftest

  merge:
    needs: [build, shard]
    runs-on: ubuntu-latest
    steps:
      # Only to load ./merge from this commit; a real caller needs no checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *bin
      - *path
      - id: fermut
        uses: ./merge
        with:
          fermut-version: project
          artifact-name: selftest
          fail-under: "50"
      - name: Assert merged outputs
        env:
          SCORED: ${{ steps.fermut.outputs.scored }}
        run: test "$SCORED" -gt 0

  trend:
    needs: [build, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *bin
      - *path
      - id: fermut
        uses: ./trend
        with:
          working-directory: ${{ env.SAMPLE }}
          fermut-version: project
          artifact-name: selftest
          fail-on-regression: "1"
          max-errored: "0"
          # This job holds a read-only token and its history must start
          # empty, so it persists nothing; the branch store is tested below.
          history-branch: ""
      - name: Assert trend outputs
        env:
          RECORDED: ${{ steps.fermut.outputs.recorded }}
          SCORED: ${{ steps.fermut.outputs.scored }}
          DELTA: ${{ steps.fermut.outputs.delta }}
          HISTORY: ${{ steps.fermut.outputs.history }}
        run: |
          echo "recorded=$RECORDED scored=$SCORED delta=$DELTA"
          test "$RECORDED" = true
          test "$SCORED" -gt 0
          test -z "$DELTA"
          test "$(wc -l < "$HISTORY")" -eq 1
          # config_hash comes from the shards, not an input; survivor_ids
          # stay off the persisted history.
          jq -e '.killed + .survived > 0 and .git_sha != null and .config_hash != null
                 and (has("survivor_ids") | not)' "$HISTORY"
      - name: Round-trip the history branch store
        env:
          ENTRY: ${{ steps.fermut.outputs.history }}
        run: |
          # A local bare repo stands in for the GitHub remote.
          git init -q --bare "$RUNNER_TEMP/remote.git"
          store() { GITHUB_SERVER_URL="file://$RUNNER_TEMP" GITHUB_REPOSITORY=remote \
                    BRANCH=fermut-history TOKEN= HISTORY="$RUNNER_TEMP/h.jsonl" \
                    bash scripts/action/history-branch.sh "$@"; }
          store read && test ! -s "$RUNNER_TEMP/h.jsonl"
          store write && store write   # the re-run is a no-op
          store read
          test "$(wc -l < "$RUNNER_TEMP/h.jsonl")" -eq 1
          cmp "$RUNNER_TEMP/h.jsonl" "$ENTRY"

  pr:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *bin
      - *path
      # Most PRs here don't touch examples/sample, so this usually exercises
      # the N/A short-circuit; blocking: false keeps a sample survivor from
      # failing an unrelated PR.
      - id: fermut
        uses: ./
        with:
          working-directory: ${{ env.SAMPLE }}
          fermut-version: project
          install-command: ${{ env.INSTALL }}
          blocking: "false"
          comment: "false"
      - name: Assert outputs
        env:
          SKIPPED: ${{ steps.fermut.outputs.skipped }}
          SCORED: ${{ steps.fermut.outputs.scored }}
        run: |
          echo "skipped=$SKIPPED scored=$SCORED"
          case "$SKIPPED" in true|false) ;; *) exit 1 ;; esac

  warm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *bin
      - *path
      - uses: ./
        with:
          warm-only: "true"
          working-directory: ${{ env.SAMPLE }}
          fermut-version: project
          install-command: ${{ env.INSTALL }}
      - run: test -s "$SAMPLE/.coverage"
