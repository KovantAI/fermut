name: Mutation (since last release)

# Mutates only what's changed since the most recent semver tag — useful for
# tracking how much net mutation debt has accumulated between releases.
# Trigger manually or on tag push.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Git ref or date to compare against (defaults to the latest semver tag)."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: install project + fermut
        run: |
          uv sync
          uv pip install pytest-cov   # `fermut coverage` runs `pytest --cov` in this venv
          uv tool install fermut

      # Per-test coverage narrows each mutant to the tests that reach it. A
      # pr-gate `fermut.toml` names `coverage = ".coverage"` explicitly, and
      # fermut errors if that file is missing.
      - run: uv tool run fermut coverage --source src --tests tests/

      - name: resolve since-ref
        id: since
        env:
          SINCE_INPUT: ${{ github.event.inputs.since }}
        run: |
          if [ -n "$SINCE_INPUT" ]; then
            ref="$SINCE_INPUT"
          else
            # Most recent semver tag *before* HEAD (on a tag push HEAD is the
            # new tag itself), or the root commit if there is no earlier tag.
            ref=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null \
                  || git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Comparing against: $ref"

      - name: run fermut since ${{ steps.since.outputs.ref }}
        env:
          SINCE_REF: ${{ steps.since.outputs.ref }}
        run: |
          uv tool run fermut run src/ \
              --tests tests/ \
              --since "$SINCE_REF" \
              --hypothesis-seed 1234 \
              --markdown fermut-incremental.md \
              --json fermut-incremental.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()  # `fermut run` exits 1 when mutants survive; still upload
        with:
          name: fermut-incremental
          path: |
            fermut-incremental.json
            fermut-incremental.md
