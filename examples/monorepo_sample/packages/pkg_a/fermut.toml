# Per-package config: stops the walk up to the monorepo-root fermut.toml, so a
# per-package sweep runs coverage and mutants from this dir. Same ops as root.

jobs = 4
timeout = 30
ty_filter = false
experimental = false
ops = [
    "arith-op-swap",
    "compare-op-swap",
    "boundary-shift",
    "return-value-to-none",
]
