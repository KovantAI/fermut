name: Mutants

# Mutation-test fermut's own Rust source with cargo-mutants.
#
# The full crate is ~2200 mutants and takes hours, so this workflow only tests
# mutants inside the PR's own diff (`--in-diff`). A PR that touches nothing
# mutable finishes in the time it takes to build the baseline.
#
# Advisory, not a gate: it does not run on `main` and is not a required check.
# Surviving mutants are a prompt to add an assertion, and sometimes the honest
# answer is "that line does not need one".

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  in-diff:
    name: cargo mutants (PR diff)
    runs-on: ubuntu-latest
    # A cold build of the ruff/ty git dependencies alone takes ~15 min, and each
    # mutant rebuilds the crate on top of it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `--in-diff` needs the base commit, which a depth-1 checkout lacks.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Restores ~/.cargo — the registry and the git checkouts of the pinned
      # ruff/ty deps, which saves the clone. It does NOT save the compile:
      # cargo-mutants builds each mutant in a scratch copy of the tree and
      # leaves the top-level target/ behind unless `copy_target` is set, so the
      # ~15 min above is paid on every run. Turning that around needs
      # `copy_target = true` plus a warm-up build, traded against copying a
      # multi-GB target dir per mutant — measure before reaching for it.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: mutants
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          # Pinned: the config schema below rejects unknown keys, so a release
          # that renames one would fail the Count step on every PR.
          tool: cargo-mutants@27.1.0

      # The default PR checkout is the merge commit, so base.sha is an ancestor
      # of HEAD and this diff is exactly what the PR changes.
      #
      # The explicit prefixes are not cosmetic: cargo-mutants matches `a/`…`b/`
      # paths, and a git configured with `diff.mnemonicPrefix` or `diff.noprefix`
      # emits something else, whereupon `--in-diff` matches nothing and the run
      # reports a clean "No mutants to filter" rather than failing.
      #
      # Context values reach the shell through the environment, never through
      # `${{ }}` interpolation into the script body: an expanded expression is
      # spliced in before the shell parses the line, so anything an attacker can
      # put in the context becomes code.
      - name: Diff against the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --src-prefix=a/ --dst-prefix=b/ "$BASE_SHA" > /tmp/pr.diff
          wc -l < /tmp/pr.diff | xargs echo "diff lines:"

      # Cheap (no build) — makes a zero-mutant run visibly zero-mutant instead
      # of indistinguishable from a silently misparsed diff.
      - name: Count mutants in the diff
        id: count
        run: |
          cargo mutants --list --in-diff /tmp/pr.diff > /tmp/list.txt
          n=$(grep -c '^src/' /tmp/list.txt || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "mutants in diff: $n"

      # `--in-diff` restricts mutants to the lines this PR added or changed.
      # continue-on-error keeps the job advisory: surviving mutants are reported
      # in the summary below rather than failing the check. cargo-mutants uses
      # distinct non-zero exit codes per outcome; we deliberately don't branch
      # on them, so a tool upgrade can't silently turn this into a gate.
      - name: Run cargo mutants
        if: steps.count.outputs.count != '0'
        continue-on-error: true
        run: cargo mutants --in-diff /tmp/pr.diff

      - name: Summarise
        if: always()
        env:
          MUTANT_COUNT: ${{ steps.count.outputs.count }}
        run: |
          out=mutants.out
          if [ "$MUTANT_COUNT" = "0" ]; then
            echo "### cargo-mutants (PR diff)" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No mutable lines in this diff — nothing to test." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -d "$out" ] || { echo "No mutants.out — the run did not get that far." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          # An outcome file is absent when nothing landed in that bucket.
          count_of() { [ -f "$out/$1.txt" ] && wc -l < "$out/$1.txt" | tr -d ' ' || echo 0; }
          caught=$(count_of caught)
          missed=$(count_of missed)
          {
            echo "### cargo-mutants (PR diff)"
            echo
            echo "| outcome | count |"
            echo "|---|---|"
            for f in caught missed timeout unviable; do
              if [ -f "$out/$f.txt" ]; then
                echo "| $f | $(count_of "$f") |"
              fi
            done
            echo
            # Reported, not enforced. Over a PR-sized diff the denominator is
            # small enough that the number swings wildly — a three-mutant diff
            # scores 0, 33, 67 or 100 — so it is a reading, not a threshold.
            # Timeouts and unviable mutants are excluded: neither says anything
            # about whether an assertion is missing.
            scored=$((caught + missed))
            if [ "$scored" -gt 0 ]; then
              echo "**Mutation score: $((caught * 100 / scored))%** ($caught caught / $scored scored)"
            else
              echo "**Mutation score: n/a** — no mutant reached a caught/missed verdict."
            fi
            if [ -s "$out/missed.txt" ]; then
              echo
              echo "<details><summary>Surviving mutants</summary>"
              echo
              echo '```'
              cat "$out/missed.txt"
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore
