# cargo-deny config: dependency vulnerability + license + source auditing.
# Run locally with `cargo deny check`; CI runs it via cargo-deny-action.

[advisories]
version = 2
# v2 defaults: RustSec vulnerabilities and yanked crates fail the check;
# unmaintained/unsound warn. The advisory DB is fetched fresh each run.

[licenses]
version = 2
# Allow-list derived from the current dependency tree (all permissive).
# A dependency introducing a license outside this set fails the check.
# `Unicode-DFS-2016` comes from unicode_names2 (via the ruff parser);
# `CDLA-Permissive-2.0` from webpki-roots (via ureq's TLS root bundle).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
]

[bans]
# Duplicate versions of the same crate: warn (bloat signal, not a failure).
multiple-versions = "warn"

[sources]
# Every crate must come from crates.io; an unknown registry or git source fails.
unknown-registry = "deny"
unknown-git = "deny"
# The ruff parser / AST / ty crates are pinned to a git tag (see Cargo.toml).
# Allow that one org; any other git source is still denied.
allow-git = ["https://github.com/astral-sh/ruff"]
