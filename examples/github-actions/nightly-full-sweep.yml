name: Mutation (nightly full sweep)

# Runs the full mutation suite every night against `main`. No diff filter, no
# sampling — exhaustive. Result lands as an HTML artifact; when mutants
# survive it files a tracking issue. A full sweep almost always has some
# survivors, so add `--fail-under N` to open issues only below a floor.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: install project + fermut
        run: |
          uv sync
          uv pip install pytest-cov # `fermut coverage` shells `pytest --cov` into this venv
          uv tool install fermut

      # fermut reads coverage.py's `.coverage` SQLite directly (no `coverage
      # json` export). `fermut coverage` runs `pytest --cov --cov-context=test`
      # so per-test contexts are recorded for per-mutant selection. Needs
      # pytest-cov in the project env. Requires a fermut with `coverage` +
      # direct `.coverage` reading.
      - name: build per-test coverage
        run: uv tool run fermut coverage

      # Exit 1 = gate failed: survivors, or nothing scored because every
      # mutant errored. Exit 3 = the run itself broke. Record the code; the
      # steps below tell survivors apart from a broken run.
      - name: full mutation sweep
        id: mutate
        run: |
          code=0
          uv tool run fermut run src/ \
              --tests tests/ \
              --no-diff-only \
              --coverage .coverage \
              --hypothesis-seed 1234 \
              --experimental \
              --jobs 8 \
              --json fermut-report.json \
              --html fermut-report.html \
              --junit fermut-report.xml || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fermut-nightly
          path: |
            fermut-report.json
            fermut-report.html
            fermut-report.xml

      - name: classify the result
        id: verdict
        if: steps.mutate.outputs.code == '1'
        run: |
          # scored == 0 with errors means nothing was tested, not survivors.
          broken=$(jq '.summary.scored == 0 and .summary.errored > 0' fermut-report.json)
          echo "broken=$broken" >> "$GITHUB_OUTPUT"

      - name: open issue for survivors
        if: steps.mutate.outputs.code == '1' && steps.verdict.outputs.broken == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
              --title "Nightly mutation survivors on $(date -u +%Y-%m-%d)" \
              --body "Survivors detected on the nightly full sweep. Download the [fermut-nightly artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the HTML report."

      - name: fail on a broken run
        if: (steps.mutate.outputs.code != '0' && steps.mutate.outputs.code != '1') || steps.verdict.outputs.broken == 'true'
        env:
          CODE: ${{ steps.mutate.outputs.code }}
        run: |
          echo "::error::fermut run broke (exit $CODE, or every mutant errored); see the log"
          exit 1
