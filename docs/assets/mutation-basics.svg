<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mutation testing in one picture: the original line return age >= 18 is changed by the boundary-shift operator into the mutant return age > 18, and the tests run against the mutant. With only test_adult, which checks age 25, every test passes, so the mutant survived and points at an untested boundary. After adding test_boundary, which checks age 18, a test fails on the mutant, so it is killed." viewBox="0 0 820 330">
<style>
svg { --ink: #1f2427; --muted: #6b7178; --line: #a0a5ab; --box: #f4f5f6; --chip: #ffffff; --accent: #ff523b; --accent-bg: #fff1ef; }
@media (prefers-color-scheme: dark) {
  svg { --ink: #e2e4e9; --muted: #9aa0a6; --line: #5c6370; --box: #2a2d36; --chip: #1e2129; --accent: #ff6a55; --accent-bg: #3a2420; }
}
text { fill: var(--ink); text-anchor: middle; font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.fm-title { font-size: 19px; font-weight: 700; }
.fm-sub { font-size: 14.5px; }
.fm-sm.fm-title { font-size: 17px; }
.fm-sm.fm-sub { font-size: 14px; }
.fm-label { fill: var(--muted); font-size: 12.5px; font-weight: 600; text-anchor: start; }
.fm-tag { fill: var(--accent); font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px; }
.fm-box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
.fm-hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
.fm-loop { fill: var(--box); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 5; }
.fm-chips rect { fill: var(--chip); stroke: var(--accent); }
.fm-chips text { font-size: 12px; font-weight: 600; }
.fm-lane { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
.fm-lane.fm-hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
.fm-row { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.fm-row-text { font-size: 13.5px; }
.fm-note { fill: var(--muted); font-size: 12.5px; }
.fm-line, .fm-edge { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.fm-edge { marker-end: url(#fm-arrow); }
.fm-edge.fm-accent { stroke: var(--accent); marker-end: url(#fm-arrow-accent); }
.fm-head { fill: var(--ink); }
.fm-head-accent { fill: var(--accent); }
.fm-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 15px; }
.fm-code-accent { fill: var(--accent); font-weight: 700; }
.fm-left { text-anchor: start; }
.fm-on { fill: var(--accent); }
.fm-off { fill: none; stroke: var(--line); stroke-width: 1.5; }
.fm-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.fm-venn-a { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2; fill-opacity: 0.6; }
.fm-venn-b { fill: var(--box); stroke: var(--ink); stroke-width: 2; fill-opacity: 0.6; }
.fm-row { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
.fm-note { fill: var(--muted); font-size: 12.5px; }
</style>

<defs>
<marker id="fm-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path class="fm-head" d="M0 0L7 3.5L0 7"/></marker>
<marker id="fm-arrow-accent" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path class="fm-head-accent" d="M0 0L7 3.5L0 7"/></marker>
</defs>

<rect class="fm-box" x="20" y="70" width="230" height="110" rx="14"/>
<text class="fm-title fm-sm" x="135" y="102">Your code</text>
<text class="fm-code" x="135" y="142">return age <tspan class="fm-code-accent">&gt;=</tspan> 18</text>
<line class="fm-edge" x1="250" y1="125" x2="292" y2="125"/>
<text class="fm-label" x="253" y="112">mutate</text>
<rect class="fm-box fm-hot" x="300" y="70" width="230" height="110" rx="14"/>
<text class="fm-title fm-sm" x="415" y="102">Mutant</text>
<text class="fm-code" x="415" y="142">return age <tspan class="fm-code-accent">&gt;</tspan> 18</text>
<text class="fm-note" x="415" y="166">boundary-shift: one small edit</text>
<path class="fm-line" d="M530 125 H552 M552 70 V180"/>
<line class="fm-edge" x1="552" y1="70" x2="572" y2="70"/>
<line class="fm-edge" x1="552" y1="180" x2="572" y2="180"/>
<rect class="fm-box fm-hot" x="580" y="20" width="220" height="100" rx="14"/>
<text class="fm-title fm-sm" x="690" y="50">Survived</text>
<text class="fm-sub fm-sm" x="690" y="74">only test_adult: is_adult(25)</text>
<text class="fm-sub fm-sm" x="690" y="96">all tests pass → a gap</text>
<rect class="fm-box" x="580" y="130" width="220" height="100" rx="14"/>
<text class="fm-title fm-sm" x="690" y="160">Killed</text>
<text class="fm-sub fm-sm" x="690" y="184">add test_boundary: is_adult(18)</text>
<text class="fm-sub fm-sm" x="690" y="206">a test fails → it noticed</text>
<rect class="fm-box fm-loop" x="20" y="256" width="780" height="56" rx="14"/>
<text class="fm-sub" x="410" y="290">score = (killed + timed out) / (killed + timed out + survived)</text>

</svg>
