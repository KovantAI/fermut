name: Mutants

# Mutation-test fermut's own Rust source with cargo-mutants.
#
# The full crate is ~2200 mutants and takes hours, so this workflow only tests
# mutants inside the PR's own diff (`--in-diff`). A PR that touches nothing
# mutable finishes in the time it takes to build the baseline.
#
# The check fails only when the diff has enough mutants for a percentage to
# mean something AND that percentage falls under the floor in
# `.github/mutants-floor.txt`. Everything else — a survivor or two on a small
# diff, a mutant nothing can kill — is reported and left alone. The weekly
# whole-crate run (mutants-weekly.yml) is the signal that actually matters;
# this one only stops a PR from walking the number down.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  in-diff:
    name: cargo mutants (PR diff)
    runs-on: ubuntu-latest
    # A cold build of the ruff/ty git dependencies alone takes ~15 min, and each
    # mutant rebuilds the crate on top of it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `--in-diff` needs the base commit, which a depth-1 checkout lacks.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Restores ~/.cargo — the registry and the git checkouts of the pinned
      # ruff/ty deps, which saves the clone. It does NOT save the compile:
      # cargo-mutants builds each mutant in a scratch copy of the tree and
      # leaves the top-level target/ behind unless `copy_target` is set, so the
      # ~15 min above is paid on every run. Turning that around needs
      # `copy_target = true` plus a warm-up build, traded against copying a
      # multi-GB target dir per mutant — measure before reaching for it.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: mutants
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          # Pinned: the config schema below rejects unknown keys, so a release
          # that renames one would fail the Count step on every PR.
          tool: cargo-mutants@27.1.0

      # The default PR checkout is the merge commit, so base.sha is an ancestor
      # of HEAD and this diff is exactly what the PR changes.
      #
      # The explicit prefixes are not cosmetic: cargo-mutants matches `a/`…`b/`
      # paths, and a git configured with `diff.mnemonicPrefix` or `diff.noprefix`
      # emits something else, whereupon `--in-diff` matches nothing and the run
      # reports a clean "No mutants to filter" rather than failing.
      #
      # Context values reach the shell through the environment, never through
      # `${{ }}` interpolation into the script body: an expanded expression is
      # spliced in before the shell parses the line, so anything an attacker can
      # put in the context becomes code.
      - name: Diff against the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --src-prefix=a/ --dst-prefix=b/ "$BASE_SHA" > /tmp/pr.diff
          wc -l < /tmp/pr.diff | xargs echo "diff lines:"

      # Cheap (no build) — makes a zero-mutant run visibly zero-mutant instead
      # of indistinguishable from a silently misparsed diff.
      - name: Count mutants in the diff
        id: count
        run: |
          cargo mutants --list --in-diff /tmp/pr.diff > /tmp/list.txt
          n=$(grep -c '^src/' /tmp/list.txt || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "mutants in diff: $n"

      # `--in-diff` restricts mutants to the lines this PR added or changed.
      #
      # continue-on-error because cargo-mutants exits non-zero as soon as one
      # mutant survives, and "one survivor" is not the bar. Whether this job
      # passes is decided by the floor comparison at the end, over numbers we
      # compute ourselves — so a tool upgrade that changes an exit code cannot
      # change what the check means.
      - name: Run cargo mutants
        if: steps.count.outputs.count != '0'
        continue-on-error: true
        run: cargo mutants --in-diff /tmp/pr.diff

      - name: Score the diff
        id: score
        if: always()
        run: |
          # The run above is skipped for a zero-mutant diff, and can fail before
          # writing results. An empty directory scores as "no verdict", which is
          # exactly what it is — the steps below branch on that rather than on
          # whether a file happens to exist.
          mkdir -p mutants.out
          .github/scripts/mutants-score.sh mutants.out | tee -a "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        env:
          MUTANT_COUNT: ${{ steps.count.outputs.count }}
          CAUGHT: ${{ steps.score.outputs.caught }}
          MISSED: ${{ steps.score.outputs.missed }}
          SCORED: ${{ steps.score.outputs.scored }}
          SCORE: ${{ steps.score.outputs.score }}
          FLOOR: ${{ steps.score.outputs.floor }}
        run: |
          out=mutants.out
          {
            echo "### cargo-mutants (PR diff)"
            echo
            if [ "$MUTANT_COUNT" = "0" ]; then
              echo "No mutable lines in this diff — nothing to test."
            elif [ "$SCORED" -eq 0 ]; then
              echo "No mutant reached a caught/missed verdict. See the artifact."
            else
              echo "| | |"
              echo "|---|---|"
              echo "| score | **${SCORE}%** |"
              [ "$FLOOR" -gt 0 ] && echo "| floor | ${FLOOR}% |"
              echo "| caught | ${CAUGHT} |"
              echo "| missed | ${MISSED} |"
              for f in timeout unviable; do
                if [ -s "$out/$f.txt" ]; then
                  echo "| $f (not scored) | $(wc -l < "$out/$f.txt" | tr -d ' ') |"
                fi
              done
              if [ -s "$out/missed.txt" ]; then
                echo
                echo "<details><summary>Surviving mutants</summary>"
                echo
                echo '```'
                cat "$out/missed.txt"
                echo '```'
                echo
                echo "</details>"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate, and the three ways past it.
      #
      # MIN_SCORED — under this many scored mutants the percentage is
      # arithmetic noise (a three-mutant diff can only score 0, 33, 67 or 100),
      # so the check reports and passes. Small diffs are covered by the weekly
      # run instead, which sees them again as part of the whole crate.
      #
      # A mutant that genuinely cannot be killed belongs in `exclude_re` or
      # `exclude_globs` in `.cargo/mutants.toml`, with a comment saying why.
      # That is the right fix: it excuses the mutant for the weekly baseline
      # too, so the crate score stops counting something no test could ever
      # reach.
      #
      # The `mutants-advisory` label is the last resort, for the PR where that
      # judgement needs a human and shouldn't hold up the merge. It downgrades
      # this step to a warning. GitHub reads labels at trigger time, so re-run
      # the job after adding one.
      - name: Gate on the floor
        if: always()
        env:
          MIN_SCORED: 10
          SCORED: ${{ steps.score.outputs.scored }}
          SCORE: ${{ steps.score.outputs.score }}
          FLOOR: ${{ steps.score.outputs.floor }}
          ADVISORY: ${{ contains(github.event.pull_request.labels.*.name, 'mutants-advisory') }}
        run: |
          if [ "$FLOOR" -eq 0 ]; then
            echo "::notice::no floor seeded in .github/mutants-floor.txt — reporting only"
            exit 0
          fi
          if [ "$SCORED" -lt "$MIN_SCORED" ]; then
            echo "::notice::${SCORED} scored mutants is under the ${MIN_SCORED} needed for the percentage to mean anything — reporting only"
            exit 0
          fi
          if [ "$SCORE" -ge "$FLOOR" ]; then
            echo "score ${SCORE}% >= floor ${FLOOR}%"
            exit 0
          fi
          msg="mutation score ${SCORE}% over ${SCORED} scored mutants is below the floor of ${FLOOR}% — see mutants.out/missed.txt in the artifact"
          if [ "$ADVISORY" = "true" ]; then
            echo "::warning::${msg} (mutants-advisory label set, not failing)"
            exit 0
          fi
          echo "::error::${msg}"
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore
