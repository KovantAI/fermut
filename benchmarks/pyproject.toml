[project]
name = "fermut-benchmarks"
version = "0.1.0"
description = "Benchmark harness comparing poodle, cosmic-ray, mutmut, fermut across reference Python repos."
requires-python = ">=3.11"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "rich>=13.7",
    "tabulate>=0.9",
]

[project.scripts]
fermut-bench = "bench.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]
