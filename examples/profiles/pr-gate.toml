# fermut profile: pr-gate — Pre-merge CI gate: diff-only + coverage + narrow ops. Fastest.
# re-run `fermut init --profile <name> --force` to switch.
#
# Generate with:  fermut init --profile pr-gate
#
# Run on a PR:
#   fermut coverage          # = pytest --cov=src --cov-context=test (needs pytest-cov)
#   fermut run src/ --markdown fermut.md

source_root = "src"
tests = "tests"
runner = "pytest"
ty_filter = true
timeout = 15
coverage = ".coverage"
diff_only = "main"
hypothesis_seed = 12345
ops = ["arith-op-swap", "compare-op-swap", "boundary-shift", "ror-equality", "ror-const", "bool-op-swap", "bool-operand-drop", "bool-const", "return-value-to-none"]
