[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "fermut"
description = "Rust-powered, ty-aware mutation testing for Python"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
authors = [{ name = "Kovant AB" }]
maintainers = [{ name = "Kovant AB" }]
keywords = [
    "mutation-testing",
    "mutation",
    "testing",
    "python",
    "rust",
    "ty",
    "pytest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/KovantAI/fermut"
Issues = "https://github.com/KovantAI/fermut/issues"

# `pytest --fermut` (python/pytest_fermut/plugin.py).
[project.entry-points.pytest11]
fermut = "pytest_fermut.plugin"

[tool.maturin]
bindings = "bin"
strip = true
# Ship the pytest plugin package next to the binary. maturin requires
# python/fermut/ (the project name) to exist once python-source is set.
python-source = "python"
python-packages = ["pytest_fermut"]
# `fermut install-skills` embeds plugins/fermut/skills/ (include_bytes! from
# src/cli/subcmd/install_skills.rs); ship it in the sdist so a source build
# compiles. python/ (whose reporter the pytest runner include_str!s) is in the
# sdist already via python-source.
include = [{ path = "plugins/fermut/skills/*/SKILL.md", format = "sdist" }]
