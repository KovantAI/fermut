# Read the Docs configuration for fermut.
# Schema: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Builds the mkdocs-material site under ./docs.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
