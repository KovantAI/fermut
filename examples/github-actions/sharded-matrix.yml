name: Mutation (sharded)

# Splits the full mutation sweep across 8 parallel runners. Each shard writes
# a JSON report; a merge job combines them into a single HTML artifact and a
# Markdown job summary.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: install project + fermut
        run: |
          uv sync
          uv pip install pytest-cov   # `fermut coverage` runs `pytest --cov` in this venv
          uv tool install fermut

      # A full sweep still needs per-test coverage: a pr-gate `fermut.toml`
      # names `coverage = ".coverage"` explicitly, and fermut errors if that
      # file is missing. (Or pass `--no-coverage` to run every test per mutant.)
      - run: uv tool run fermut coverage --source src --tests tests/

      - name: run shard ${{ matrix.shard }}/8
        run: |
          uv tool run fermut run src/ \
              --tests tests/ \
              --shard ${{ matrix.shard }}/8 \
              --no-diff-only \
              --hypothesis-seed 1234 \
              --json "shard-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()  # shards with survivors exit 1; still upload
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json

  merge:
    needs: mutate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: install fermut
        run: uv tool install fermut

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: shards
          merge-multiple: true

      # Each shard's report describes the WHOLE mutant universe — its own slice
      # with real verdicts, every other mutant recorded as skipped by the shard
      # filter. `fermut merge` unions the real verdicts across shards; use a
      # fermut release whose merge keeps a real verdict over another shard's
      # skip placeholder (older merges collapsed to the last-read report).
      - name: merge shard reports
        run: |
          uv tool run fermut merge shards/shard-*.json \
              --json combined.json \
              --html report.html \
              --markdown report.md \
              --junit report.xml
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fermut-report
          path: |
            combined.json
            report.html
            report.md
            report.xml
