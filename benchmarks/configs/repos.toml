# Reference Python repos under benchmark.
#
# Each entry: url + ref pinned for reproducibility, plus the source path and
# test command the mutation tools should drive. `target_paths` is what each
# mutation tool mutates; `test_cmd` is forwarded verbatim to the tool's pytest
# runner (each adapter rewrites flags as needed).
#
# Refs are tags rather than branches so a cold clone always lands on the same
# commit. Bump them deliberately when refreshing the suite.

[more-itertools]
url = "https://github.com/more-itertools/more-itertools.git"
ref = "v10.5.0"
src_path = "more_itertools"
test_path = "tests"
# `.[testing]` does not pull pytest on this tag — install it explicitly or
# every mutant errors at pytest spawn and the score falsely defaults to 100%.
install_cmd = "pip install -e .[testing] && pip install pytest"
test_cmd = "pytest tests"
# Loop scenario edits this file with a no-op then reverts.
loop_edit_file = "more_itertools/recipes.py"

[click]
url = "https://github.com/pallets/click.git"
ref = "8.1.7"
src_path = "src/click"
test_path = "tests"
# pytest<9: click 8.1.7 runs with filterwarnings=error and parametrizes with an
# itertools.chain, which pytest 9.2 deprecates (PytestRemovedIn10Warning).
install_cmd = "pip install -e . && pip install 'pytest<9'"
test_cmd = "pytest tests"
loop_edit_file = "src/click/core.py"
# NOTE: mutmut 3.x cannot mutate click — circular import (mutmut's own CLI
# uses click, so mutated click breaks mutmut's bootstrap). Use mutmut 2.x
# data for click. mutmut_also_copy / mutmut_deselect would be needed for a
# 3.x run but are irrelevant here.

[typer]
url = "https://github.com/fastapi/typer.git"
ref = "0.26.7"
src_path = "typer"
test_path = "tests"
# Non-editable install so mutmut 3.x's `mutants/typer` sys.path win isn't
# shadowed by an editable .pth pointing at original typer. fermut sets
# its own PYTHONPATH=mirror/src and is unaffected by the change.
install_cmd = "pip install . && pip install pytest pytest-xdist coverage[toml] rich shellingham"
test_cmd = "pytest tests"
loop_edit_file = "typer/main.py"
# Fail inside fermut's copy: they render tmp_path, which is longer there, and
# rich wraps it at 80 columns (same deselects as schemata/run10.sh).
pytest_extra_args = [
  "--deselect=tests/test_tutorial/test_parameter_types/test_path/test_tutorial002.py::test_not_exists",
  "--deselect=tests/test_type_conversion.py::test_path_convert_failures",
]
# mutmut 3.x copies tree to mutants/. typer tests import docs_src/* fixtures.
mutmut_also_copy = ["docs_src", "scripts"]
# Test depends on filesystem-order arg expansion: runs `tutorial001 README.md
# pyproject.toml` and asserts first match is README.md. In mutants/ cwd
# globbing yields a different order — test sees pyproject.toml first.
mutmut_deselect = [
  "tests/test_tutorial/test_multiple_values/test_arguments_with_multiple_values/test_tutorial001.py::test_main",
  "tests/test_types_file.py::test_binary_stderr",
]
# Mutate only typer/main.py + typer/core.py — full pkg = 7020 mutants, too slow.
fermut_exclude = [
  "__init__.py",
  "__main__.py",
  "_click/**",
  "_completion_classes.py",
  "_completion_shared.py",
  "_types.py",
  "_typing.py",
  "cli.py",
  "colors.py",
  "completion.py",
  "models.py",
  "params.py",
  "rich_utils.py",
  "testing.py",
  "utils.py",
]

[starlette]
url = "https://github.com/encode/starlette.git"
ref = "0.52.1"
src_path = "starlette"
test_path = "tests"
# Pinned: httpx<0.28 (JSON serialization), anyio<4.5 (deprecation-emission
# test in 0.41.x is sensitive to anyio internals; 0.52.x is newer + tolerant
# but kept pin for stability), pytest 8.x: on 7.4 + Python 3.13
# test_lifespan_with_on_events fails its own baseline (deprecated_call: DID
# NOT WARN); <9 keeps clear of pytest 9.2's new deprecations under
# filterwarnings=error (as click).
install_cmd = "pip install -e . && pip install 'pytest>=8,<9' httpx 'anyio<4.5' trio itsdangerous jinja2 python-multipart pyyaml typing_extensions"
test_cmd = "pytest tests"
loop_edit_file = "starlette/routing.py"

[pyjwt]
url = "https://github.com/jpadilla/pyjwt.git"
ref = "2.13.0"
src_path = "jwt"
test_path = "tests"
install_cmd = "pip install -e . && pip install pytest 'cryptography>=3.4.0'"
test_cmd = "pytest tests"
loop_edit_file = "jwt/api_jwt.py"

[trio]
url = "https://github.com/python-trio/trio.git"
ref = "v0.33.0"
src_path = "src/trio"
# Trio's tests live inside the package (src/trio/_tests, _core/_tests).
# Pytest plugin must be loaded explicitly.
test_path = "src/trio/_tests"
install_cmd = "pip install -e . && pip install pytest pytest-trio attrs sortedcontainers idna outcome sniffio trustme astor PyYAML pyOpenSSL isort"
test_cmd = "pytest -p trio._tests.pytest_plugin --import-mode=importlib src/trio/_tests"
loop_edit_file = "src/trio/_core/_run.py"
# test_static_tool_sees_all_symbols / test_gen_exports need tools the venv
# lacks (same as schemata/run10.sh).
pytest_extra_args = [
  "-p", "trio._tests.pytest_plugin", "--import-mode=importlib",
  "--deselect=src/trio/_tests/test_exports.py::test_static_tool_sees_all_symbols",
  "--ignore=src/trio/_tests/tools/test_gen_exports.py",
]
# NOTE: mutmut 3.x is infeasible for trio — tests introspect source line
# numbers, exported symbols, and frames, which mutmut's trampoline
# injection breaks file-wide. Even after ignoring obvious offenders, the
# mutation run produced no recorded outcomes after 3h+. fermut handles it
# because each mutant run is judged on rc-change, not absolute baseline.
mutmut_ignore = [
  "src/trio/_tests/test_deprecate.py",
  "src/trio/_tests/test_exports.py",
  "src/trio/_tests/test_tracing.py",
]

[markupsafe]
url = "https://github.com/pallets/markupsafe.git"
ref = "3.0.3"
src_path = "src/markupsafe"
test_path = "tests"
# Test deps live in PEP-735 `[dependency-groups]`, which `pip install -e .`
# does not pull — install pytest explicitly. Has an optional C speedups
# extension with a pure-Python fallback; editable build picks up the C one
# when a compiler is present.
install_cmd = "pip install -e . && pip install pytest"
test_cmd = "pytest tests"
loop_edit_file = "src/markupsafe/__init__.py"

[jinja2]
url = "https://github.com/pallets/jinja2.git"
ref = "3.1.6"
src_path = "src/jinja2"
test_path = "tests"
# MarkupSafe pulled as a runtime dep by `-e .`. Babel needed for the i18n /
# ext tests; trio for the async tests (test_async imports trio directly);
# pytest from the (uninstalled) dependency-group.
install_cmd = "pip install -e . && pip install pytest Babel trio"
test_cmd = "pytest tests"
loop_edit_file = "src/jinja2/environment.py"

[werkzeug]
url = "https://github.com/pallets/werkzeug.git"
ref = "3.1.8"
src_path = "src/werkzeug"
test_path = "tests"
# `[dependency-groups].tests` = cffi, cryptography, ephemeral-port-reserve,
# pytest, pytest-timeout, watchdog. The serving/reloader/security tests fail
# to collect without them. Large package (~15k LoC) — runs are heavy even
# with the coverage filter.
# coverage==7.17.0: 7.17.1+ with `--cov-context=test` builds a Path while
# test_safe_join_windows_special has os.name patched to "nt" → WindowsPath
# raises, and pytest INTERNALERRORs formatting the failure (no .coverage).
install_cmd = "pip install -e . && pip install pytest pytest-timeout cryptography cffi ephemeral-port-reserve watchdog 'coverage==7.17.0' pytest-cov"
# tests/test_serving.py starts live reloader servers that hang (with watchdog 7
# the coverage run sat >30 min); same deselect as schemata/run10.sh.
test_cmd = "pytest tests --deselect=tests/test_serving.py"
loop_edit_file = "src/werkzeug/http.py"
pytest_extra_args = ["--deselect=tests/test_serving.py"]
# Fail mutmut 3.x's clean stats pass (it aborts on the first failure): its
# trampolines show up where these tests introspect frames, locals and
# wrapped callables.
mutmut_deselect = [
  "tests/test_debug.py::TestDebugHelpers::test_debug_dump",
  "tests/test_datastructures.py::TestFileStorage::test_bytes_proper_sentinel[data0]",
  "tests/test_datastructures.py::TestFileStorage::test_bytes_proper_sentinel[data1]",
  "tests/test_local.py::test_proxy_wrapped",
]

[flask]
url = "https://github.com/pallets/flask.git"
ref = "3.1.3"
src_path = "src/flask"
test_path = "tests"
# Runtime deps (werkzeug, jinja2, click, itsdangerous, blinker, markupsafe)
# come via `-e .`. `[dependency-groups].tests` = asgiref, greenlet, pytest,
# python-dotenv (async + cli + reloader tests need them).
# pytest<9: flask 3.1.3's tests/test_cli.py imports `_pytest.monkeypatch.notset`,
# which pytest 9.2 removed.
install_cmd = "pip install -e . && pip install 'pytest<9' asgiref greenlet python-dotenv"
test_cmd = "pytest tests"
loop_edit_file = "src/flask/app.py"
# Fails its own baseline in this env (same deselect as schemata/run10.sh).
pytest_extra_args = ["--deselect=tests/test_reqctx.py::test_bad_environ_raises_bad_request"]

# --- application repos (#69 follow-up: app-shaped suites, DB fixtures) ---

[healthchecks]
url = "https://github.com/healthchecks/healthchecks.git"
ref = "v5.0.3"
# Django app, BSD-3. ~17k src LOC (no migrations/tests), ~24k test LOC, every
# test a DB-backed Django TestCase on SQLite. Tests live inside the package
# (hc/<app>/tests/).
src_path = "hc"
test_path = "hc"
# Upstream runs `manage.py test`; both tools need pytest, so add pytest-django.
# hc/settings.py applies its test overrides (MAILERS, fast hasher, blocking
# email) only when sys.argv[1] == "test", so bench_settings.py (repo root,
# outside the mutated package) re-applies them for pytest.
install_cmd = '''pip install -r requirements.txt -r requirements-dev.txt pytest pytest-django 'coverage==7.17.0' pytest-cov && printf 'from hc.settings import *  # noqa\nSECRET_KEY = "bench"\nPASSWORD_HASHERS = ["django.contrib.auth.hashers.MD5PasswordHasher"]\nBLOCKING_EMAILS = True\nMAILERS = {"default": {"BACKEND": "django.core.mail.backends.smtp.EmailBackend", "OPTIONS": {}}}\n' > bench_settings.py && printf '[pytest]\nDJANGO_SETTINGS_MODULE = bench_settings\n' > pytest.ini'''
test_cmd = "pytest hc"
loop_edit_file = "hc/api/models.py"
# Scoped to hc/api (~4.2k LOC: check/ping/flip models, API views): the whole
# package (54.8k mutants) runs ~1 h on fermut alone because each fork re-creates
# the Django test DB. The full suite still runs (coverage picks per mutant).
fermut_exclude = [
  "**/tests/**", "**/migrations/**",
  "accounts/**", "front/**", "integrations/**", "lib/**", "logs/**", "payments/**",
  "__init__.py", "settings.py", "test.py", "urls.py", "wsgi.py",
]
# mutmut 3 copies source_paths + tests into mutants/; Django also needs the
# root-level settings, pytest config and templates.
mutmut_also_copy = ["bench_settings.py", "pytest.ini", "templates", "static", "manage.py", "CHANGELOG.md", "search.db"]

[flaskbb]
url = "https://github.com/flaskbb/flaskbb.git"
ref = "v3.0.0"
# Flask + SQLAlchemy forum, BSD-3. ~24k src LOC, ~11k test LOC, 809 tests,
# ~45 s single-process; app-factory + SQLite fixtures.
src_path = "flaskbb"
test_path = "tests"
install_cmd = "pip install -e . && pip install pytest pytest-mock pytest-xprocess freezegun responses 'coverage==7.17.0' pytest-cov"
# pyproject addopts force `--numprocesses auto` (xdist; not installed, and
# coverage contexts need one process). Replace addopts, keeping the repo's
# strict markers and its own deprecation-as-error.
test_cmd = "pytest tests -o 'addopts=--strict-markers --pythonwarnings=error::flaskbb.deprecation.FlaskBBDeprecation'"
loop_edit_file = "flaskbb/forum/models.py"
# test_flaskbbdomain_translations needs the compiled *.mo catalogues, which
# `pip install -e .` builds but .gitignore lists; fermut's mirror honours
# .gitignore and drops them (fermut gap). Deselected for both tools.
pytest_extra_args = [
  "-o", "addopts=--strict-markers --pythonwarnings=error::flaskbb.deprecation.FlaskBBDeprecation",
  "--deselect=tests/unit/utils/test_translations.py::test_flaskbbdomain_translations",
]
# Scoped to flaskbb/forum (~3.7k LOC: topics, posts, forums models + views).
fermut_exclude = [
  "migrations/**",
  "auth/**", "cli/**", "configs/**", "core/**", "display/**", "fixtures/**",
  "management/**", "permissions/**", "plugins/**", "search/**", "settings/**",
  "tokens/**", "upload/**", "user/**", "utils/**",
  "__init__.py", "__main__.py", "_version.py", "app.py", "deprecation.py", "email.py", "exceptions.py", "extensions.py", "markup.py",
]
