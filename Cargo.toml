[package]
name = "fermut"
version = "0.2.2"
edition = "2021"
rust-version = "1.83"
authors = ["Kovant AB"]
description = "Rust-powered, ty-aware mutation testing for Python"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/KovantAI/fermut"
homepage = "https://github.com/KovantAI/fermut"
documentation = "https://fermut.readthedocs.io/"
keywords = ["mutation-testing", "mutation", "testing", "pytest", "python"]
categories = ["development-tools::testing", "command-line-utilities"]
include = [
    "src/**/*",
    "examples/github-actions/pr-gate.yml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[[bin]]
name = "fermut"
path = "src/main.rs"

[lib]
name = "fermut"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
fs2 = "0.4"
globset = "0.4"
ignore = "0.4"
indicatif = "0.18"
notify = "8"
rayon = "1"
reflink-copy = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
hmac = "0.13"
subtle = "2"
similar = "3"
tempfile = "3"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
wait-timeout = "0.2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

# Astral parser + AST + text-range crates. Pinned to a ruff release tag.
# Bump the tag together to keep API consistency. Verify the tag exists at
# https://github.com/astral-sh/ruff/tags before changing.
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.5" }
ruff_python_ast    = { git = "https://github.com/astral-sh/ruff", tag = "0.15.21" }
ruff_text_size     = { git = "https://github.com/astral-sh/ruff", tag = "0.15.21" }

# Embedded ty checker. Same git tag as the parser above to share salsa
# intern tables and avoid duplicate-crate hazards. Wired by
# `src/filter/ty_embedded.rs`; the subprocess fallback in
# `src/filter/ty.rs` covers the cases where `ty_project` construction
# fails (pre-release API surface).
ruff_db            = { git = "https://github.com/astral-sh/ruff", tag = "0.15.21", features = ["os"] }
ruff_notebook      = { git = "https://github.com/astral-sh/ruff", tag = "0.15.21" }
ty_project         = { git = "https://github.com/astral-sh/ruff", tag = "0.15.21" }
ty_python_semantic = { git = "https://github.com/astral-sh/ruff", tag = "0.15.21" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
