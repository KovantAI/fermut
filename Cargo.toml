[package]
name = "fermut"
version = "0.4.1"
edition = "2021"
rust-version = "1.83"
authors = ["Kovant AB"]
description = "Rust-powered, ty-aware mutation testing for Python"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/KovantAI/fermut"
homepage = "https://github.com/KovantAI/fermut"
documentation = "https://fermut.readthedocs.io/"
keywords = ["mutation-testing", "mutation", "testing", "pytest", "python"]
categories = ["development-tools::testing", "command-line-utilities"]
include = [
    "src/**/*",
    "examples/github-actions/pr-gate.yml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[[bin]]
name = "fermut"
path = "src/main.rs"

[lib]
name = "fermut"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
fs2 = "0.4"
globset = "0.4"
ignore = "0.4"
indicatif = "0.18"
notify = "8"
rayon = "1"
reflink-copy = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# sha2 0.11 / hmac 0.13 are the current RustCrypto majors (successors to the
# long-stable 0.10/0.12 line). Deliberately on latest for the cache-integrity
# HMAC-SHA256 path — same audited primitives, current API. Revisit only on a
# RUSTSEC advisory or a breaking-API bump.
sha2 = "0.11"
hex = "0.4"
hmac = "0.13"
subtle = "2"
similar = "3"
tempfile = "3"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
wait-timeout = "0.2"
which = "6"
# Minimal on purpose: the Anthropic client is a single stateless JSON POST, so
# cookie storage and gzip (with their cookie_store / time / flate2 trees) are
# dead weight. `rustls` brings TLS + webpki roots; `json` brings send/read_json.
# The tests/deps_hygiene.rs guard fails if this set drifts back to defaults.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

# Astral parser + AST + text-range crates. Pinned to a ruff release tag.
# Bump the tag together to keep API consistency. Verify the tag exists at
# https://github.com/astral-sh/ruff/tags before changing.
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.5" }
ruff_python_ast    = { git = "https://github.com/astral-sh/ruff", tag = "0.16.5" }
ruff_text_size     = { git = "https://github.com/astral-sh/ruff", tag = "0.16.5" }

# Embedded ty checker. Same git tag as the parser above to share salsa
# intern tables and avoid duplicate-crate hazards. Wired by
# `src/filter/ty_embedded.rs`; the subprocess fallback in
# `src/filter/ty.rs` covers the cases where `ty_project` construction
# fails (pre-release API surface).
ruff_db            = { git = "https://github.com/astral-sh/ruff", tag = "0.16.5", features = ["os"] }
ruff_notebook      = { git = "https://github.com/astral-sh/ruff", tag = "0.16.5" }
ty_project         = { git = "https://github.com/astral-sh/ruff", tag = "0.16.7" }
ty_python_semantic = { git = "https://github.com/astral-sh/ruff", tag = "0.16.5" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
# Deterministic mtime control for the coverage-freshness guard tests (avoids
# sleep-based ordering, which is flaky on coarse-resolution filesystems).
filetime = "0.2"
# Only to construct a `ureq::Error::Rustls` in the transport-retry test; must
# track the rustls major ureq 3 links (0.23).
rustls = "0.23"

# Lint baseline. CI runs `cargo clippy -- -D warnings`, so every lint below is
# an error in CI and locally/IDE, not just an advisory. Kept curated + green
# rather than blanket `clippy::pedantic`, which currently fires ~40 lints
# (mostly `cast_possible_truncation`) — tighten toward pedantic incrementally.
[lints.rust]
# No new `unsafe` without an explicit, reviewed opt-in. The only two FFI sites
# (process-group kill in `runner/process_group.rs`) carry a scoped
# `#[allow(unsafe_code)]` with a SAFETY note.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"           # no stray `dbg!` in committed code
todo = "warn"                # `todo!()` must not ship
unimplemented = "warn"       # nor `unimplemented!()`
mem_forget = "warn"
verbose_file_reads = "warn"
inefficient_to_string = "warn"
lossy_float_literal = "warn"

[lints.rustdoc]
# `lib.rs` documents the module map with intra-doc links; fail the build if any
# break so the doc can't silently drift from the code.
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
